name: PetShop

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Verificar versão do Java
        run: |
          java -version
          javac -version

      - name: Compilar projeto
        run: mvn clean compile

      - name: Executar testes unitários
        run: mvn test

      - name: Gerar aplicação
        run: mvn package -DskipTests

      - name: Upload do JAR
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: calculadora-java
          path: target/*.jar